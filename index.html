<!DOCTYPE html>
<html lang="en">
<head>

<body>

    <h1>Contáctame, soy: Dania Regina Pineda Benigno</h1>

    <form method="GET">
        <fieldset>
            <legend><h1>Datos Generales</h1></legend>

            <h3>Nombre: <input type="text" name="nombre"></h3>
            <h3>Apellidos: <input type="text" name="apellidos"></h3>

            <h3><input type="radio" name="genero" value="femenino"> Femenino</h3>

            <h3><input type="checkbox" name="hobbie3"> Música</h3>
            <h3><input type="checkbox" name="hobbie4" checked> Todas las anteriores</h3>

            <h1>Estado Civil</h1>
            <select name="edocivil">
                <option disabled selected>-- Seleccione una opción --</option>
                <option value="casado">Casado</option>
                <option value="soltero">Soltero</option>
                <option value="divorciado">Divorciado</option>
                <option value="viudo">Viudo</option>
                <option value="union">Unión Libre</option>
            </select>

            <br><br>
           <input type="image" src="enviar.png" width="130" height="33">
